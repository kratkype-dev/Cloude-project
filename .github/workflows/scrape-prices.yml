name: Nápojový radar – týdenní měření

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday ~07:17 Prague time
  workflow_dispatch:        # "Run workflow" button for a manual run
  push:                     # a change of the dashboard or code: republish from existing data, no scraping
    branches: [main]
    paths:
      - "price_tracker/**"

permissions:
  contents: write   # commit new data back to the repository
  pages: write      # publish the dashboard on GitHub Pages
  id-token: write

concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Scrape
        id: scrape
        continue-on-error: true   # keep data from the platforms that succeeded
        run: python -m price_tracker scrape
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: měření $(TZ=Europe/Prague date +%F)"
          git push
      - name: Prepare website
        run: |
          mkdir -p _site
          cp data/dashboard.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Fail if a platform failed
        if: steps.scrape.outcome == 'failure'
        run: echo "::warning::Některá platforma se nestáhla, podrobnosti jsou v kroku Scrape."

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build dashboard from existing data
        run: |
          python -m price_tracker report
          mkdir -p _site
          cp data/dashboard.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [scrape, publish]
    if: always() && (needs.scrape.result == 'success' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
