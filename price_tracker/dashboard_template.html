<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceny Coca-Cola a Pepsi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4;
          --price:#2563eb; --regular:#a8a29e; --sale:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --card:#292524;
          --line:#44403c; --price:#60a5fa; --regular:#78716c; --sale:#f87171; }
  }
  :root[data-theme="dark"] { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --card:#292524;
          --line:#44403c; --price:#60a5fa; --regular:#78716c; --sale:#f87171; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  select, input { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
                  background:var(--card); color:var(--fg); max-width:100%; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .chart { position:relative; height:320px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  tr.row { cursor:pointer; } tr.row:hover { background:var(--bg); }
  .sale { color:var(--sale); font-weight:600; }
  .wrap { overflow-x:auto; }
  a { color:var(--price); }
</style>
</head>
<body>
<main>
  <h1>Ceny Coca-Cola a PepsiCo — Rohlík a Košík</h1>
  <p class="sub" id="sub"></p>
  <div class="filters">
    <select id="shop"><option value="">Všechny obchody</option></select>
    <select id="owner"><option value="">Coca-Cola i PepsiCo</option></select>
    <select id="brand"><option value="">Všechny značky</option></select>
    <label><input type="checkbox" id="onlySale"> jen aktuálně ve slevě</label>
    <input id="q" placeholder="Hledat produkt…">
  </div>
  <div class="card">
    <strong id="title">Vyberte produkt v tabulce</strong>
    <div class="chart"><canvas id="chart"></canvas></div>
  </div>
  <div class="card wrap">
    <table>
      <thead><tr><th>Obchod</th><th>Značka</th><th>Produkt</th><th>Balení</th>
        <th class="n">Cena</th><th class="n">Běžná</th><th class="n">Min</th><th class="n">Dní ve slevě</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const DATA = /*DATA*/[];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const fmt = v => v == null ? "–" : v.toFixed(2).replace(".", ",");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const uniq = k => [...new Set(DATA.map(d => d[k]))].sort();
for (const [id, key] of [["shop","shop"],["owner","owner"],["brand","brand"]])
  for (const v of uniq(key)) $(id).add(new Option(v, v));
const dates = DATA.flatMap(d => d.points.map(p => p[0]));
$("sub").textContent = dates.length
  ? `${DATA.length} produktů · měření ${dates.reduce((a,b)=>a<b?a:b)} – ${dates.reduce((a,b)=>a>b?a:b)}`
  : "Zatím žádná data";
let chart;
function show(d) {
  $("title").innerHTML = `${esc(d.shop)} · <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a> ${esc(d.amount)}`;
  const labels = d.points.map(p => p[0]);
  chart?.destroy();
  chart = new Chart($("chart"), {
    type: "line",
    data: { labels, datasets: [
      { label: "Cena", data: d.points.map(p => p[1]), borderColor: css("--price"), stepped: true,
        pointBackgroundColor: d.points.map(p => p[3] ? css("--sale") : css("--price")), pointRadius: 3 },
      { label: "Běžná cena", data: d.points.map(p => p[2]), borderColor: css("--regular"),
        borderDash: [5,4], stepped: true, pointRadius: 0 } ] },
    options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: css("--fg") } } },
      scales: { x: { ticks: { color: css("--muted") }, grid: { color: css("--line") } },
                y: { ticks: { color: css("--muted"), callback: v => v + " Kč" }, grid: { color: css("--line") } } } }
  });
}
function render() {
  const f = { shop: $("shop").value, owner: $("owner").value, brand: $("brand").value };
  const q = $("q").value.toLowerCase();
  const list = DATA.filter(d => (!f.shop || d.shop === f.shop) && (!f.owner || d.owner === f.owner)
    && (!f.brand || d.brand === f.brand) && (!q || d.name.toLowerCase().includes(q))
    && (!$("onlySale").checked || d.points.at(-1)[3]));
  $("rows").innerHTML = "";
  for (const d of list) {
    const last = d.points.at(-1), prices = d.points.map(p => p[1]).filter(v => v != null);
    const sale = d.points.filter(p => p[3]).length;
    const tr = document.createElement("tr");
    tr.className = "row";
    tr.innerHTML = `<td>${esc(d.shop)}</td><td>${esc(d.brand)}</td><td>${esc(d.name)}</td><td>${esc(d.amount)}</td>
      <td class="n ${last[3] ? "sale" : ""}">${fmt(last[1])}</td><td class="n">${fmt(last[2])}</td>
      <td class="n">${fmt(Math.min(...prices))}</td><td class="n">${sale} / ${d.points.length}</td>`;
    tr.onclick = () => show(d);
    $("rows").append(tr);
  }
  if (list.length) show(list[0]);
}
for (const id of ["shop","owner","brand","onlySale","q"]) $(id).addEventListener("input", render);
render();
</script>
</body>
</html>
